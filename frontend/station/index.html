<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Станция</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1a16">
<link rel="manifest" href="/station/manifest.json">
<link rel="icon" href="/assets/icons/station-192.png">
<link rel="apple-touch-icon" href="/assets/icons/station-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Станция">
<script>
/* Режим ставится до первого кадра, иначе ночью экран мигает белым. */
try {
  var m = localStorage.getItem('pos-theme');
  if (m === 'night') document.documentElement.dataset.theme = 'night';
} catch (e) {}
</script>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>

<!-- Баннер потери связи перекрывает всё намеренно: тихий устаревший список
     хуже ошибки — по нему готовят то, что уже отменили. -->
<div id="offline" class="offline" hidden>
  <p class="head">Нет связи</p>
  <p class="body">Список на экране устарел. Не готовьте по нему — ждём сервер.</p>
</div>

<header class="topbar" hidden id="bar">
  <span class="netdot" id="link" title="связь с сервером"></span>
  <h1 id="title">Станция</h1>
  <span class="station-state" id="state"></span>
  <span class="who" id="who"></span>
  <button class="btn" id="theme" type="button">Ночь</button>
  <button class="btn" id="out" type="button">Выйти</button>
</header>

<main id="board" class="board"></main>

<script src="/assets/theme.js"></script>
<script src="/assets/api.js"></script>
<script src="/assets/auth.js"></script>
<script src="/assets/live.js"></script>
<script src="/assets/sound.js"></script>
<script src="/assets/station.js"></script>
<script src="/assets/pwa.js" data-sw="/station/sw.js" data-scope="/station/"></script>
<script>
Auth.start(me => {
  document.getElementById('bar').hidden = false;
  Theme.start();
  Board.start(me);
});
</script>
</body>
</html>
